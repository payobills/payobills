installed:
- agent-context
settings:
  auto_execute_hooks: true
hooks:
  after_specify:
  - extension: agent-context
    command: speckit.agent-context.update
    enabled: false
    optional: true
    priority: 10
    prompt: Execute speckit.agent-context.update?
    description: Refresh agent context after specification
    condition: null
  after_plan:
  - extension: agent-context
    command: speckit.agent-context.update
    enabled: false
    optional: true
    priority: 10
    prompt: Execute speckit.agent-context.update?
    description: Refresh agent context after planning
    condition: null
  - extension: notion-push
    command: speckit.notion.push
    enabled: true
    optional: true
    priority: 20
    prompt: Push spec files to Notion? (requires NOTION_DOCS_ROOT_URL env var)
    description: Publish spec artifacts to Notion under the configured docs root page
    condition: null
